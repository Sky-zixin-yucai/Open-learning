[build-system]
requires = ["setuptools>=61.0", "wheel>=0.37.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openlearning"
version = "0.0.9"
description = "A dependency installation tool for the Open-learning project"
readme = "README.md"
authors = [
    {name = "Open-learning Team", email = "skyzixinyucai@126.com"}
]
license = "Apache-2.0"
requires-python = ">=3.8"

dependencies = [
    "torch>=1.9.0",
    "numpy>=1.19.0"
]

[project.optional-dependencies]
dev = ["pytest", "black"]

[project.scripts]
open-learning-cli = "openlearning.cli:main"