[build-system]
requires = ["setuptools>=61.0", "wheel>=0.37.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openboat"
version = "0.0.1"
description = "Rule-Governed Architecture (RGA) – a novel neural framework with geological memory and phase transition"
readme = "README.md"
authors = [
    {name = "Open-learning Team", email = "skyzixinyucai@126.com"}
]
license = {text = "Apache-2.0"}
requires-python = ">=3.8"
keywords = ["deep learning", "RGA", "geological memory", "phase transition", "PyTorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=1.9.0",
    "numpy>=1.19.0",
    "jieba>=0.42.1",
    "tqdm>=4.64.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "isort>=5.0.0",
]
doc = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/Sky-zixin-yucai/Open-learning"
Repository = "https://github.com/Sky-zixin-yucai/Open-learning.git"
BugTracker = "https://github.com/Sky-zixin-yucai/Open-learning/issues"

[project.scripts]
openboat = "openboat.cli:main"

[tool.setuptools.packages.find]
include = ["openboat*"]